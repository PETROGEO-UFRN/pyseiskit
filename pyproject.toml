[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "pyseiskit"
version = "0.1.1"
description = "A Python library for seismic data processing and pre-visualization."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "JorbFreire", email = "jorbfreire@gmail.com" },
]
dependencies = [
    "numpy",
    "scipy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = [
    "seismic",
    "geophysics",
    "wiggle",
    "SU",
    "seismic unix",
    "data processing",
]

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/PETROGEO-UFRN/pyseiskit"
Repository = "https://github.com/PETROGEO-UFRN/pyseiskit"

[tool.hatch.build.targets.wheel]
packages = [
    "pyseiskit",
]
